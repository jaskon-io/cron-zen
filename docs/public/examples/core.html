<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cron-zen · core 引擎 Demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <script type="importmap">
      {
        "imports": {
          "@cron-zen/core": "https://cdn.jsdelivr.net/npm/@cron-zen/core@0.2.4/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>@cron-zen/core（只要引擎）</h1>
      <p class="lead">
        无 UI。试一下解析 / 描述 / 近 N 次 / 已触发 / 模板。完整函数说明见
        <a href="/cron-zen/api/core">API · core</a>。
      </p>
      <nav class="nav" aria-label="示例导航">
        <a href="./vanilla.html">vanilla</a>
        <a href="./react.html">react</a>
        <a href="./vue2.html">vue2</a>
        <a href="./vue3.html">vue3</a>
        <a href="./core.html" class="is-current">core 引擎</a>
        <a href="/cron-zen/guide/examples">文档 · 示例总览</a>
      </nav>

      <div class="grid panel" style="padding: 1rem">
        <label for="expr">Cron 表达式</label>
        <input id="expr" type="text" value="0 0 9 ? * 2-6" />

        <div class="grid-2">
          <div>
            <label for="tz">timeZone</label>
            <input id="tz" type="text" value="Asia/Shanghai" />
          </div>
          <div>
            <label for="locale">locale</label>
            <select id="locale">
              <option value="zh-CN" selected>zh-CN</option>
              <option value="en-US">en-US</option>
            </select>
          </div>
        </div>

        <div class="toolbar" style="margin: 0">
          <button type="button" id="run" class="is-on">解析 &amp; 预览</button>
          <button type="button" id="pick-preset">套用模板…</button>
        </div>
        <select id="preset" hidden></select>
      </div>

      <pre class="out" id="out">点击「解析 &amp; 预览」</pre>
    </main>

    <script type="module">
      import {
        parseCron,
        generateCron,
        describeCron,
        getNextRuns,
        getPrevRuns,
        formatRunTime,
        getCronPresets,
        validateCronState,
      } from '@cron-zen/core'

      var exprEl = document.getElementById('expr')
      var tzEl = document.getElementById('tz')
      var localeEl = document.getElementById('locale')
      var outEl = document.getElementById('out')
      var presetEl = document.getElementById('preset')

      function fillPresets() {
        var list = getCronPresets(localeEl.value)
        presetEl.innerHTML = ''
        list.forEach(function (p) {
          var opt = document.createElement('option')
          opt.value = p.expression
          opt.textContent = p.label + ' · ' + p.expression
          presetEl.appendChild(opt)
        })
      }

      function run() {
        var tz = { timeZone: tzEl.value || undefined }
        var locale = localeEl.value
        var parsed = parseCron(exprEl.value)
        if (!parsed.success) {
          outEl.innerHTML = '<span class="error">parse 失败：' + (parsed.error || '') + '</span>'
          return
        }
        var state = parsed.state
        var valid = validateCronState(state)
        var gen = generateCron(state)
        var next = getNextRuns(state, 5, new Date(), tz)
        var prev = getPrevRuns(state, 5, new Date(), tz)
        var lines = [
          '<strong>describe</strong> · ' + describeCron(state, { locale: locale }),
          '<strong>generate</strong> · ' + (gen.success ? gen.expression : gen.error),
          '<strong>validate</strong> · valid=' +
            valid.valid +
            (valid.errors && valid.errors.length ? ' errors=' + valid.errors.join('; ') : ''),
          '',
          '<strong>getNextRuns</strong>',
          '<ul class="list">' +
            next.map(function (d) {
              return '<li>' + formatRunTime(d, tz) + '</li>'
            }).join('') +
            '</ul>',
          '<strong>getPrevRuns</strong>（新→旧）',
          '<ul class="list">' +
            prev.map(function (d) {
              return '<li>' + formatRunTime(d, tz) + '</li>'
            }).join('') +
            '</ul>',
        ]
        outEl.innerHTML = lines.join('\n')
      }

      document.getElementById('run').onclick = run
      document.getElementById('pick-preset').onclick = function () {
        fillPresets()
        presetEl.hidden = false
        presetEl.focus()
      }
      presetEl.onchange = function () {
        exprEl.value = presetEl.value
        run()
      }
      localeEl.onchange = fillPresets
      fillPresets()
      run()
    </script>
  </body>
</html>
