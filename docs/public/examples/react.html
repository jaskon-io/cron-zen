<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cron-zen · react Demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@cron-zen/react@0.2.4/dist/cron-zen-react.css"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
          "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm",
          "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@18.3.1/jsx-runtime/+esm",
          "@cron-zen/core": "https://cdn.jsdelivr.net/npm/@cron-zen/core@0.2.4/+esm",
          "@cron-zen/vanilla": "https://cdn.jsdelivr.net/npm/@cron-zen/vanilla@0.2.4/+esm",
          "@cron-zen/react": "https://cdn.jsdelivr.net/npm/@cron-zen/react@0.2.4/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>@cron-zen/react</h1>
      <p class="lead">React 18/19 · ESM CDN · 薄封装 vanilla，行为与 vue3 对齐。</p>
      <nav class="nav" aria-label="示例导航">
        <a href="./vanilla.html">vanilla</a>
        <a href="./react.html" class="is-current">react</a>
        <a href="./vue2.html">vue2</a>
        <a href="./vue3.html">vue3</a>
        <a href="./core.html">core 引擎</a>
        <a href="/cron-zen/guide/examples">文档 · 示例总览</a>
      </nav>

      <div id="app"></div>
    </main>

    <script type="module">
      import React, { useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import { CronZen } from '@cron-zen/react'

      function App() {
        const [cron, setCron] = useState('0 0 9 ? * 2-6')
        return React.createElement(
          'div',
          null,
          React.createElement(
            'div',
            { className: 'panel' },
            React.createElement(CronZen, {
              value: cron,
              onChange: (expr) => setCron(expr),
              locale: 'zh-CN',
              timeZone: 'Asia/Shanghai',
              nextCount: 5,
              showPreview: true,
            }),
          ),
          React.createElement(
            'p',
            { className: 'out' },
            React.createElement('strong', null, 'expression'),
            ' · ',
            cron || '（空）',
          ),
        )
      }

      createRoot(document.getElementById('app')).render(React.createElement(App))
    </script>
  </body>
</html>
