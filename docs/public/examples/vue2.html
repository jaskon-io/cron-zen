<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cron-zen · vue2 Demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@cron-zen/vue2@0.2.4/dist/cron-zen-vue2.css"
    />
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.esm.browser.js",
          "@cron-zen/core": "https://cdn.jsdelivr.net/npm/@cron-zen/core@0.2.4/+esm",
          "@cron-zen/vue2": "https://cdn.jsdelivr.net/npm/@cron-zen/vue2@0.2.4/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>@cron-zen/vue2</h1>
      <p class="lead">Vue 2.7 · ESM CDN · <code>v-model</code> / <code>.sync</code> 对齐 vue3。</p>
      <nav class="nav" aria-label="示例导航">
        <a href="./vanilla.html">vanilla</a>
        <a href="./react.html">react</a>
        <a href="./vue2.html" class="is-current">vue2</a>
        <a href="./vue3.html">vue3</a>
        <a href="./core.html">core 引擎</a>
        <a href="/cron-zen/guide/examples">文档 · 示例总览</a>
      </nav>

      <div id="app">
        <div class="panel">
          <cron-zen
            :value="cron"
            locale="zh-CN"
            time-zone="Asia/Shanghai"
            :next-count="5"
            :show-preview="true"
            @input="onCron"
            @update:value="onCron"
          />
        </div>
        <p class="out"><strong>expression</strong> · {{ cron || '（空）' }}</p>
      </div>
    </main>

    <script type="module">
      import Vue from 'vue'
      import { CronZen } from '@cron-zen/vue2'

      new Vue({
        el: '#app',
        components: { CronZen },
        data() {
          return { cron: '0 0 9 ? * 2-6' }
        },
        methods: {
          onCron(v) {
            this.cron = v
          },
        },
      })
    </script>
  </body>
</html>
